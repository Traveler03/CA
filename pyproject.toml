[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipag-concept-usage-bank"
version = "0.1.0"
description = "Corpus-driven Wikipag concept and usage-card construction pipeline"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
wiki = [
  "requests>=2.31",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
